spring:
  profiles:
    default: dev
    group:
      dev: dev,legacy
      prod-oauth2: prod,docker,oauth2

  main:
    web-application-type: servlet

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}
          quitwait: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_QUITWAIT:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${app.kafka.groups.pedidos:pedidos-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: br.com.redemaisfarma.*
        spring.json.use.type.headers: true
    listener:
      missing-topics-fatal: false

  task:
    scheduling:
      pool:
        size: 2

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  show-actuator: true
  cache:
    disabled: true
  group-configs:
    - group: public
      paths-to-match: /api/**
    - group: admin
      paths-to-match: /actuator/**

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,mappings,loggers,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    loggers:
      enabled: true

security:
  jwt:
    enabled: ${JWT_ENABLED:false}
    issuer: ${JWT_ISSUER:redemaisfarma-api}
    secret: ${JWT_SECRET:dev-secret}
    access-token:
      ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token:
      ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

jwt:
  enabled: ${JWT_ENABLED:false}
  issuer: ${JWT_ISSUER:redemaisfarma-api}
  secret: ${JWT_SECRET:dev-secret}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

app:
  config:
    envProfileLabel: ${APP_CONFIG_ENV_PROFILE_LABEL:dev}
    networkPortLabel: ${APP_CONFIG_NETWORK_PORT_LABEL:8080}
  security:
    oauth2:
      enabled: false
      post-login-redirect: /
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@local.redemaisfarma}
  kafka:
    groups:
      pedidos: ${APP_KAFKA_GROUP_PEDIDOS:pedidos-consumer}

api:
  base-path: /api
  version: v2

---
# =========================
# PERFIL: dev (+ legacy)
# =========================
spring:
  config:
    activate:
      on-profile: dev

  mvc:
    log-resolved-exception: true

  datasource:
    url: jdbc:mysql://localhost:3306/redemaisfarma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # quando estabilizar, troque para 'none'
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-mysql
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

security:
  jwt:
    enabled: true

jwt:
  enabled: true

logging:
  level:
    root: INFO
    br.com.redemaisfarma: DEBUG
    org.springframework.web: DEBUG
    org.springframework.http.converter.json: TRACE
    org.springframework.web.servlet.mvc.method.annotation: TRACE
    com.fasterxml.jackson.databind: DEBUG
    org.springframework.web.servlet.view: TRACE
    org.springframework.boot.autoconfigure: INFO
    org.springdoc: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# >>> OVERRIDE DO MANAGEMENT PARA DEV <<<
management:
  server:
    port: 18090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,loggers
  endpoint:
    health:
      show-details: when_authorized

# Config do agendador de import do Firebird (usada pelo @ConditionalOnProperty e pelo scheduler)
sync:
  firebird:
    enabled: true
    period-ms: 300000     # 5 min
    batch-size: 1000

---
# =========================
# PERFIL: legacy (datasource Firebird)
# =========================
spring:
  config:
    activate:
      on-profile: legacy

  datasource:
    firebird:
      url: ${FB_URL:jdbc:firebirdsql://localhost:3050/C:/DIGIFARMA/DADOS.FDB?encoding=UTF8}
      username: ${FB_USER:sysdba}
      password: ${FB_PASSWORD:masterkey}
      driver-class-name: org.firebirdsql.jdbc.FBDriver
      hikari:
        maximum-pool-size: 4
        minimum-idle: 1
        connection-timeout: 30000

---
# =========================
# PERFIL: prod-oauth2
# =========================
spring:
  config:
    activate:
      on-profile: prod-oauth2

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}

springdoc:
  show-actuator: false
  cache:
    disabled: false
