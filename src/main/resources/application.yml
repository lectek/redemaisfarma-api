spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    mysql:
      url: jdbc:mysql://localhost:3306/redemaisfarma?useSSL=false&serverTimezone=UTC
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

    firebird:
      url: jdbc:firebirdsql://localhost:3050/digifarma6.fdb?encoding=UTF8&authPlugins=Legacy_Auth&wireCrypt=DISABLED
      username: SYSDBA
      password: masterkey
      driver-class-name: org.firebirdsql.jdbc.FBDriver

  jpa:
    hibernate:
      ddl-auto: none
