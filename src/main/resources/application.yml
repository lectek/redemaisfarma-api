spring:
  profiles:
    default: dev
    group:
      dev: dev,legacy
      prod-oauth2: prod,docker,oauth2

  main:
    web-application-type: servlet

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}
          quitwait: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_QUITWAIT:false}

  kafka:
    # Para desenvolvimento fora de Docker, localhost:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${app.kafka.groups.pedidos:pedidos-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: br.com.redemaisfarma.*
        spring.json.use.type.headers: true
    listener:
      missing-topics-fatal: false

  task:
    scheduling:
      pool:
        size: 2

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /docs
    filter: true
    try-it-out-enabled: true
    display-request-duration: true
    deep-linking: true
    doc-expansion: none
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
    default-models-expand-depth: -1
    default-model-expand-depth: 2
    custom-css-url: /swagger-ui/swagger-custom.css
    custom-js: /swagger-ui/swagger-custom.js
  show-actuator: true
  cache:
    disabled: true
  group-configs:
    - group: public
      paths-to-match: /api/public/**
    - group: admin
      paths-to-match: /api/admin_**, /api/private_**, /api/admin/**, /api/private/**
    - group: export
      paths-to-match: /api/export/**
    - group: actuator
      paths-to-match: /actuator/**

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

management:
  server:
    # Mantém o Actuator na MESMA porta do app para casar com o healthcheck do container
    port: ${MANAGEMENT_SERVER_PORT:${PORT:${SERVER_PORT:8080}}}
  endpoints:
    web:
      base-path: /actuator
      # Exponha health e info (suficiente para liveness/readiness)
      exposure:
        include: health,info
  endpoint:
    health:
      # Mostra detalhes só localmente; mude para "never" se não quiser vazar detalhes
      show-details: always
      probes:
        enabled: true
    loggers:
      enabled: true

# JWT – mantidos os dois blocos porque o projeto aparenta ler ambos
security:
  jwt:
    enabled: ${JWT_ENABLED:false}
    issuer: ${JWT_ISSUER:redemaisfarma-api}
    secret: ${JWT_SECRET:dev-secret}
    access-token:
      ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token:
      ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

jwt:
  enabled: ${JWT_ENABLED:false}
  issuer: ${JWT_ISSUER:redemaisfarma-api}
  secret: ${JWT_SECRET:dev-secret}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

app:
  config:
    envProfileLabel: ${APP_CONFIG_ENV_PROFILE_LABEL:dev}
    networkPortLabel: ${APP_CONFIG_NETWORK_PORT_LABEL:8080}
  security:
    oauth2:
      enabled: false
      post-login-redirect: /
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@local.redemaisfarma}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    provider: ${APP_SMS_PROVIDER:twilio}
    from: ${APP_SMS_FROM:}
    default-country-code: ${APP_SMS_DEFAULT_COUNTRY_CODE:55}
    twilio:
      account-sid: ${APP_SMS_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
      auth-token: ${APP_SMS_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
      messaging-service-sid: ${APP_SMS_TWILIO_MESSAGING_SERVICE_SID:${TWILIO_MESSAGING_SERVICE_SID:}}
  kafka:
    groups:
      pedidos: ${APP_KAFKA_GROUP_PEDIDOS:pedidos-consumer}
legacy:
  sync:
    enabled: ${LEGACY_SYNC_ENABLED:false}

api:
  base-path: /api
  version: v2

---
# Overrides para rodar DENTRO do Docker (profile: docker)
spring:
  config:
    activate:
      on-profile: docker

  kafka:
    # Usa o broker do Compose (porta 9094 exposta pelo Bitnami com KRaft)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redemaisfarma-kafka-dev:9094}
    listener:
      # Se quiser garantir startup mesmo sem Kafka, deixe true; ajuste depois conforme necessidade
      missing-topics-fatal: false
      # Opcional: desligar listeners na subida do container até estabilizar o ambiente
      # auto-startup: false

  mail:
    host: ${SPRING_MAIL_HOST:redemaisfarma-mailpit-dev}
    port: ${SPRING_MAIL_PORT:8025}

management:
  server:
    # Mantém 8080 para alinhar com o healthcheck (http://127.0.0.1:8080/actuator/health/liveness)
    port: ${MANAGEMENT_SERVER_PORT:8080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
