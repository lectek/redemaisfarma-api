<!-- fragments/sidebar.html -->
<aside class="sidebar"
       th:fragment="sidebar(active='')"
       role="complementary"
       aria-label="Menu lateral"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <nav class="sidebar__nav">
    <ul class="sidebar__list">
      <li>
        <a th:href="@{/}"
           class="sidebar__link"
           th:classappend="${active}=='home' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='home' ? 'page' : null"><span>Home</span></a>
      </li>
      <li>
        <a th:href="@{/cliente/conta}"
           class="sidebar__link"
           th:classappend="${active}=='conta' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='conta' ? 'page' : null"><span>Minha conta</span></a>
      </li>
      <li>
        <a th:href="@{/cliente/dados}"
           class="sidebar__link"
           th:classappend="${active}=='dados' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='dados' ? 'page' : null"><span>Meus dados</span></a>
      </li>
      <li>
        <a th:href="@{/produtos}"
           class="sidebar__link"
           th:classappend="${active}=='produtos' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='produtos' ? 'page' : null"><span>Produtos</span></a>
      </li>
      <li>
        <a th:href="@{/carrinho}"
           class="sidebar__link"
           th:classappend="${active}=='carrinho' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='carrinho' ? 'page' : null"><span>Meu carrinho</span></a>
      </li>
      <li>
        <a th:href="@{/sobre}"
           class="sidebar__link"
           th:classappend="${active}=='sobre' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='sobre' ? 'page' : null"><span>Sobre nós</span></a>
      </li>

      <!-- Admin -->
      <li class="sidebar__admin-link">
        <a th:href="@{/admin}"
           class="sidebar__link sidebar__link--muted"
           th:classappend="${active}=='admin' ? ' is-active' : ''"
           th:attr="aria-current=${active}=='admin' ? 'page' : null"><span>Entrar como admin</span></a>
      </li>
    </ul>
  </nav>
</aside>
