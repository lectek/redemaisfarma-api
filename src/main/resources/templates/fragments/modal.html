<!-- Modal HTML Profissional e Responsivo -->
<div id="modal-embalando" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <!-- Fundo escurecido -->
  <div class="modal-backdrop" data-close-modal></div>

  <!-- Caixa de conteúdo -->
  <div class="modal-content" role="document">
    <!-- Cabeçalho do modal -->
    <header class="modal-header">
      <h2 id="modal-title">Detalhes do Produto</h2>
      <button class="modal-close" aria-label="Fechar" data-close-modal>&times;</button>
    </header>

    <!-- Corpo do modal -->
    <div class="modal-body">
      <p>Este produto contém ração premium com 20kg e desconto exclusivo para assinantes.</p>
      <!-- Pode colocar um formulário ou botão aqui -->
    </div>

    <!-- Rodapé do modal -->
    <footer class="modal-footer">
      <button class="btn-cancelar" data-close-modal>Cancelar</button>
      <button class="btn-confirmar">Adicionar ao carrinho</button>
    </footer>
  </div>
</div>
