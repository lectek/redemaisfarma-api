<!-- templates/fragments/flash.html -->
<div class="flash-stack" th:fragment="flash" aria-live="polite">
  <div class="alert" th:if="${success}" th:text="${success}" role="status">Acao realizada com sucesso.</div>
  <div class="alert alert-info" th:if="${info}" th:text="${info}" role="status">Informacao.</div>
  <div class="alert alert-warning" th:if="${warning}" th:text="${warning}" role="alert">Atencao.</div>
  <div class="alert alert-error" th:if="${error}" th:text="${error}" role="alert">Ocorreu um erro.</div>
</div>
