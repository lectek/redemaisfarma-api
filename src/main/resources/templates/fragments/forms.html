<!-- fragments/forms.html -->
<section class="form-section">
  <h2 class="form-title">Cadastre seu produto</h2>

  <form action="#" method="POST" class="form-embalando">
    <div class="form-group">
      <label for="nome">Nome do Produto</label>
      <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required />
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" placeholder="Breve descrição do produto" rows="4"></textarea>
    </div>

    <div class="form-group-inline">
      <div class="form-group">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" name="preco" step="0.01" placeholder="Ex: 29.90" required />
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecione</option>
          <option value="acessorios">Acessórios</option>
          <option value="alimentacao">Alimentação</option>
          <option value="higiene">Higiene</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="imagem">Imagem do Produto</label>
      <input type="file" id="imagem" name="imagem" accept="image/*" />
    </div>

    <button type="submit" class="btn-form">Cadastrar Produto</button>
  </form>
</section>
