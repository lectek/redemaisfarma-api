<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Produto</title></head>
<body class="container">
  <h1 th:text="${form.id == null ? 'Adicionar produto' : 'Editar produto'}">Adicionar produto</h1>

  <form th:action="${form.id == null} ? @{/admin/produtos} : @{'/admin/produtos/' + ${form.id}}"
        method="post" enctype="multipart/form-data" class="grid gap-16 md:grid-cols-2">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- ÁREA DE UPLOAD / PREVIEW -->
    <section>
      <label class="block mb-2">Imagem do produto</label>
      <div id="drop" style="border:2px dashed #cbd5e1;border-radius:12px;padding:16px;text-align:center">
        <img id="preview" th:if="${form.imagemUrl != null}" th:src="${form.imagemUrl}"
             alt="" style="max-width:240px;max-height:240px;display:block;margin:0 auto 8px"/>
        <input id="file" type="file" name="imagem" accept="image/*"/>
        <p class="text-sm muted">Arraste uma imagem aqui ou clique para selecionar</p>
      </div>
    </section>

    <!-- CAMPOS -->
    <section class="stack">
      <label>Nome
        <input type="text" name="nome" th:value="${form.nome}" required/>
      </label>

      <label>Categoria
        <select name="categoriaId" th:value="${form.categoriaId}">
          <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}">Analgésicos</option>
        </select>
      </label>

      <label>Preço
        <input type="number" name="preco" step="0.01" min="0" th:value="${form.preco}" required/>
      </label>

      <label>Estoque
        <input type="number" name="estoque" step="1" min="0" th:value="${form.estoque}" required/>
      </label>

      <label>Descrição
        <textarea name="descricao" rows="4" th:text="${form.descricao}"></textarea>
      </label>

      <div class="flex gap-8 mt-4">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/admin/produtos}" class="btn">Cancelar</a>
      </div>
    </section>
  </form>

  <!-- Preview e Drag & Drop -->
  <script>
    (function(){
      const file = document.getElementById('file');
      const drop = document.getElementById('drop');
      const preview = document.getElementById('preview');

      function showPreview(f){
        if(!f) return;
        const url = URL.createObjectURL(f);
        if (preview) { preview.src = url; preview.style.display = 'block'; }
        else {
          const img = document.createElement('img');
          img.id='preview'; img.src=url; img.style='max-width:240px;max-height:240px;display:block;margin:0 auto 8px';
          drop.prepend(img);
        }
      }

      file.addEventListener('change', e => showPreview(e.target.files[0]));
      ;['dragover','dragenter'].forEach(evt => drop.addEventListener(evt, e=>{e.preventDefault(); drop.style.borderColor='#60a5fa';}));
      ;['dragleave','drop'].forEach(evt => drop.addEventListener(evt, e=>{e.preventDefault(); drop.style.borderColor='#cbd5e1';}));
      drop.addEventListener('drop', e => { const f=e.dataTransfer.files[0]; if(!f) return; file.files = e.dataTransfer.files; showPreview(f); });
      drop.addEventListener('click', ()=> file.click());
    })();
  </script>
</body>
</html>
