<!-- src/main/resources/templates/admin/produtos/lista.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Produtos • Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>

<div class="layout">
  <aside th:replace="~{fragments/sidebar :: sidebar('produtos')}"></aside>

  <main id="main-content" class="container stack mt-4 mb-6">
    <div class="between">
      <h1 class="page-title">Produtos</h1>
      <div class="row gap-2">
        <a class="btn" th:href="@{/admin/produtos/novo}">Novo produto</a>
        <a class="btn btn-ghost"
           th:href="@{/admin/produtos/export.csv(q=${q}, categoria=${categoria})}">Exportar CSV</a>
      </div>
    </div>

    <form class="form-row mb-4" th:action="@{/admin/produtos}" method="get">
      <input class="input" name="q" type="search" placeholder="Buscar por nome, descrição ou EAN…"
             th:value="${q}" />
      <select class="select" name="categoria" th:value="${categoria}">
        <option value="">Todas categorias</option>
        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoria</option>
      </select>
      <button class="btn">Filtrar</button>
    </form>

    <section class="card table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>#</th><th>Imagem</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${page.content}">
          <td th:text="${p.id}">1</td>
          <td>
            <img th:if="${p.imagem != null and !#strings.isEmpty(p.imagem)}" th:src="${p.imagem}" alt=""
                 style="height:42px;border-radius:6px" loading="lazy" />
            <span th:if="${p.imagem == null or #strings.isEmpty(p.imagem)}" class="muted">—</span>
          </td>
          <td th:text="${p.nome}">Nome</td>
          <td th:text="${p.categoria}">Categoria</td>
          <td th:text="${p.precoVenda != null ? 'R$ ' + #numbers.formatDecimal(p.precoVenda, 2, 'COMMA') : '—'}">R$ 0,00</td>
          <td th:text="${p.estoque}">0</td>
          <td class="flex gap-6">
            <a th:href="@{|/admin/produtos/${p.id}/editar|}" class="btn-sm">Editar</a>
            <form th:action="@{|/admin/produtos/${p.id}/imagem/regenerate|}" method="post"
                  th:if="${p.imagem == null or #strings.isEmpty(p.imagem)}">
              <button class="btn-sm" title="Gerar imagem automática">Gerar img</button>
            </form>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(page.content)}">
          <td colspan="7" class="text-center text-muted">Nenhum produto cadastrado.</td>
        </tr>
        </tbody>
      </table>
    </section>

    <!-- Paginação -->
    <nav class="pagination mt-4" th:if="${page.totalPages > 1}" aria-label="Paginação">
      <a class="btn" th:classappend="${page.first} ? ' disabled'"
         th:href="@{/admin/produtos(q=${q}, categoria=${categoria}, page=${page.number-1}, size=${page.size})}">Anterior</a>
      <span class="muted">Página <span th:text="${page.number+1}">1</span> de <span th:text="${page.totalPages}">1</span></span>
      <a class="btn" th:classappend="${page.last} ? ' disabled'"
         th:href="@{/admin/produtos(q=${q}, categoria=${categoria}, page=${page.number+1}, size=${page.size})}">Próxima</a>
    </nav>
  </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
