<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Cliente • RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">

  <main class="form-container">
    <section class="form-card">

      <h1 class="form-title">Cadastro de Cliente</h1>

      <form th:action="@{/cadastro-cliente}" th:object="${cadastroForm}" method="post" class="form-grid" autocomplete="off">

        <!-- Nome completo -->
        <div class="form-group">
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" th:field="*{nome}" class="input" required />
          <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></p>
        </div>

        <!-- E-mail -->
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" th:field="*{email}" class="input" required />
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></p>
        </div>

        <!-- Senha -->
        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" th:field="*{senha}" class="input" required />
          <p th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="error-message"></p>
        </div>

        <!-- Confirmar senha -->
        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha:</label>
          <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" class="input" required />
          <p th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}" class="error-message"></p>
        </div>
