<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Usuários • Admin</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
  <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>
  <main class="container stack mt-4 mb-6">
    <div class="between">
      <h1 class="page-title">Usuários</h1>
      <a class="btn btn-primary" th:href="@{/admin/usuarios/novo}">Novo usuário</a>
    </div>
    <form class="form-row mb-4" th:action="@{/admin/usuarios}" method="get">
      <input class="input" type="search" name="q" placeholder="Buscar por nome, e-mail, CPF" th:value="${param.q}"/>
      <select class="select" name="papel" th:value="${param.papel}">
        <option value="">Todos os papéis</option>
        <option>ADMIN</option><option>FARMACEUTICO</option><option>CAIXA</option><option>CLIENTE_VIP</option>
      </select>
      <button class="btn">Filtrar</button>
    </form>
    <section class="card table-responsive">
      <table class="table">
        <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.nome}">Fulano</td>
            <td th:text="${u.email}">fulano@ex.com</td>
            <td th:text="${u.papel}">ADMIN</td>
            <td><span class="badge" th:text="${u.ativo} ? 'Ativo' : 'Inativo'">Ativo</span></td>
            <td class="actions">
              <a class="btn btn-ghost" th:href="@{|/admin/usuarios/${u.id}|}">Perfil</a>
              <a class="btn btn-ghost" th:href="@{|/admin/usuarios/${u.id}/editar|}">Editar</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="text-center text-muted">Nenhum usuário.</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
