<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>E-mails • Templates</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
<aside th:replace="~{fragments/sidebar :: sidebar('marketing')}"></aside>
<main class="container stack mt-4 mb-6">
  <div class="between">
    <h1 class="page-title">Templates de e-mail</h1>
    <a class="btn btn-primary" th:href="@{/admin/marketing/emails/editor}">Novo template</a>
  </div>
  <section class="card table-responsive">
    <table class="table">
      <thead><tr><th>Nome</th><th>Assunto</th><th>Última atualização</th><th>Ações</th></tr></thead>
      <tbody>
        <tr th:each="t : ${templates}">
          <td th:text="${t.nome}">Boas-vindas</td>
          <td th:text="${t.assunto}">Bem-vindo</td>
          <td th:text="${#dates.format(t.atualizadoEm,'dd/MM/yyyy HH:mm')}">…</td>
          <td class="actions">
            <a class="btn btn-ghost" th:href="@{|/admin/marketing/emails/editor?id=${t.id}|}">Editar</a>
            <a class="btn btn-ghost" th:href="@{|/admin/marketing/emails/campanhas?template=${t.id}|}">Campanhas</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(templates)}"><td colspan="4" class="text-center text-muted">Nenhum template.</td></tr>
      </tbody>
    </table>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
