<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>E-mails • Editor</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
<aside th:replace="~{fragments/sidebar :: sidebar('marketing')}"></aside>
<main class="container stack mt-4 mb-6">
  <h1 class="page-title">Editor de Template</h1>
  <form class="form-grid card" th:action="@{/admin/marketing/emails/editor}" method="post" th:object="${template}">
    <input type="hidden" th:field="*{id}"/>
    <div class="form-group"><label>Nome</label><input class="input" th:field="*{nome}" required/></div>
    <div class="form-group"><label>Assunto</label><input class="input" th:field="*{assunto}" required/></div>
    <div class="form-group"><label>HTML do e-mail</label><textarea class="input" rows="14" th:field="*{html}" placeholder="<!DOCTYPE html>…"></textarea></div>
    <fieldset class="fieldset">
      <legend>Teste</legend>
      <div class="form-row">
        <input class="input" type="email" name="testeDestino" placeholder="destinatario@exemplo.com"/>
        <button class="btn" name="acao" value="teste">Enviar teste</button>
      </div>
    </fieldset>
    <div class="form-actions"><button class="btn btn-primary">Salvar</button></div>
  </form>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
