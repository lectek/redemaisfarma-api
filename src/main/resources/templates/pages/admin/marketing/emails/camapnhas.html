<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>E-mails • Campanhas</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
<aside th:replace="~{fragments/sidebar :: sidebar('marketing')}"></aside>
<main class="container stack mt-4 mb-6">
  <h1 class="page-title">Campanhas</h1>
  <form class="card form-grid" th:action="@{/admin/marketing/emails/campanhas}" method="post" th:object="${campanha}">
    <div class="form-group"><label>Template</label>
      <select class="select" th:field="*{templateId}">
        <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.nome}">Template</option>
      </select>
    </div>
    <div class="form-group"><label>Lista/Segmento</label>
      <select class="select" th:field="*{segmento}">
        <option value="TODOS">Todos os clientes</option>
        <option value="VIP">Clientes VIP</option>
        <option value="INATIVOS_90D">Inativos (90 dias)</option>
      </select>
    </div>
    <div class="form-row">
      <input class="input" type="datetime-local" th:field="*{agendarPara}"/>
      <label class="checkbox"><input type="checkbox" th:field="*{envioImediato}"/> Envio imediato</label>
    </div>
    <div class="form-actions"><button class="btn btn-primary">Criar campanha</button></div>
  </form>
  <section class="card mt-6 table-responsive">
    <h2 class="card-title">Histórico</h2>
    <table class="table">
      <thead><tr><th>Nome</th><th>Template</th><th>Segmento</th><th>Status</th><th>Criada em</th></tr></thead>
      <tbody>
        <tr th:each="c : ${campanhas}">
          <td th:text="${c.nome}">Promo</td>
          <td th:text="${c.templateNome}">Boas-vindas</td>
          <td th:text="${c.segmento}">TODOS</td>
          <td th:text="${c.status}">AGENDADA</td>
          <td th:text="${#dates.format(c.criadaEm,'dd/MM/yyyy HH:mm')}">…</td>
        </tr>
        <tr th:if="${#lists.isEmpty(campanhas)}"><td colspan="5" class="text-center text-muted">Sem campanhas.</td></tr>
      </tbody>
    </table>
  </section>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
