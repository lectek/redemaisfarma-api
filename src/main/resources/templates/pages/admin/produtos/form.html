<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Produto • Form</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
<aside th:replace="~{fragments/sidebar :: sidebar('produtos')}"></aside>
<main class="container stack mt-4 mb-6">
  <h1 class="page-title" th:text="${produto.id} != null ? 'Editar produto' : 'Novo produto'">Produto</h1>
  <form class="form-grid" th:action="@{/admin/produtos}" method="post" th:object="${produto}" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}"/>
    <div class="form-group"><label>Nome</label><input class="input" th:field="*{nome}" required/></div>
    <div class="form-group"><label>Descrição</label><textarea class="input" th:field="*{descricao}" rows="4"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Preço (R$)</label><input class="input" type="number" step="0.01" th:field="*{preco}" required/></div>
      <div class="form-group"><label>Estoque</label><input class="input" type="number" min="0" th:field="*{estoque}" required/></div>
      <div class="form-group"><label>Categoria</label>
        <select class="select" th:field="*{categoria}">
          <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}">Categoria</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Imagem</label><input class="input" type="file" name="imagemFile" accept=".png,.jpg,.jpeg,.webp,.svg"/></div>
    <div class="form-actions"><button class="btn btn-primary">Salvar</button></div>
  </form>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
