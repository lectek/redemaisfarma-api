<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editar produto • Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <style>
    #toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9999}
    .toast{background:#0f1320;color:#e9eef6;border:1px solid rgba(255,255,255,.07);
           border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .toast.ok{border-color:rgba(46,204,113,.5)}
    .toast.err{border-color:rgba(231,76,60,.5)}
  </style>
</head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container stack mt-4 mb-6" th:with="id=${produtoId} ?: ${produto?.id}">
  <div class="between">
    <h1 class="page-title">Editar produto</h1>
    <a class="btn btn-ghost" th:href="@{/admin/produtos}">Voltar</a>
  </div>

  <div class="card p-4">
    <form id="form-editar" class="grid grid-cols-1 md:grid-cols-2 gap-4" onsubmit="return false;">
      <input type="hidden" id="id" th:value="${id}" />

      <label class="stack">
        <span>Nome</span>
        <input class="input" id="nome" type="text" th:value="${produto?.nome}" required />
      </label>

      <label class="stack">
        <span>Categoria</span>
        <input class="input" id="categoria" type="text" th:value="${produto?.categoria}" list="datalist-cat" />
        <datalist id="datalist-cat">
          <option th:each="c: ${categorias}" th:value="${c}"></option>
        </datalist>
      </label>

      <label class="stack md:col-span-2">
        <span>Descrição</span>
        <textarea class="input" id="descricao" rows="3" th:text="${produto?.descricao}"></textarea>
      </label>

      <label class="stack">
        <span>Preço de venda</span>
        <input class="input" id="preco" type="number" step="0.01" min="0" th:value="${produto?.precoVenda}" />
      </label>

      <label class="stack">
        <span>Estoque</span>
        <input class="input" id="estoque" type="number" step="1" min="0" th:value="${produto?.estoque}" />
      </label>

      <label class="stack">
        <span>Código de barras (EAN)</span>
        <input class="input" id="codigoBarras" type="text" th:value="${produto?.codigoBarras}" />
      </label>

      <label class="stack">
        <span>Disponível</span>
        <input id="disponivel" type="checkbox" th:checked="${produto == null ? true : produto.disponivel}" />
      </label>

      <label class="stack md:col-span-2">
        <span>URL da imagem</span>
        <input class="input" id="imagem" type="url" th:value="${produto?.imagem}" />
      </label>

      <!-- Ações IA -->
      <div class="form-row gap-2 md:col-span-2">
        <button id="btn-gerar-ia" class="btn btn-primary" type="button" th:attr="data-id=${id}">
          Gerar imagem com IA
        </button>
        <button id="btn-regerar-ia" class="btn btn-ghost" type="button" th:attr="data-id=${id}">
          Regenerar
        </button>
      </div>

      <div class="md:col-span-2 between mt-2">
        <div class="row gap-2">
          <button id="btn-salvar" class="btn btn-primary" type="button">Salvar</button>
          <a class="btn btn-ghost" th:href="@{/admin/produtos}">Cancelar</a>
        </div>
        <span id="status" class="muted"></span>
      </div>
    </form>
  </div>
</main>

<div id="toast"></div>

<script th:src="@{/js/lib/ui.js}"></script>
<script th:src="@{/js/pages/produto-editar.js}"></script>
</body>
</html>
