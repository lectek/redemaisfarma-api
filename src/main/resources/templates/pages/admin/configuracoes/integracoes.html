<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Configurações • Integrações</title><link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body class="body-flex">
<header th:replace="~{fragments/header :: header}"></header>
<div class="layout">
<aside th:replace="~{fragments/sidebar :: sidebar('conf-integracoes')}"></aside>
<main class="container stack mt-4 mb-6">
  <h1 class="page-title">Integrações</h1>
  <form class="card form-grid" th:action="@{/admin/configuracoes/integracoes}" method="post" th:object="${cfg}">
    <div class="form-row">
      <input class="input" th:field="*{apiKey}" placeholder="API Key"/>
      <input class="input" th:field="*{apiSecret}" type="password" placeholder="API Secret" autocomplete="new-password"/>
      <input class="input" th:field="*{webhookUrl}" type="url" placeholder="Webhook URL"/>
    </div>
    <div class="form-actions"><button class="btn btn-primary">Salvar</button></div>
  </form>
</main></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body></html>
