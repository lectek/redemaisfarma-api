<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title th:text="${title} ?: 'Central de E-mails • Admin — RedeMaisFarma'">Central de E-mails</title>
  <meta name="description" content="Administração de e-mails enviados pela plataforma RedeMaisFarma." />

  <!-- Open Graph básicos -->
  <meta property="og:title" content="Central de E-mails • Admin" />
  <meta property="og:description" content="Monitore e reprocessse e-mails." />
  <meta property="og:type" content="website" />

  <!-- CSS global do projeto -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body class="body-flex">

  <!-- Acessibilidade -->
  <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

  <!-- Cabeçalho (fragmento compartilhado) -->
  <header th:replace="~{fragments/header :: header}">
    <p class="visually-hidden">Carregando cabeçalho...</p>
  </header>

  <!-- Conteúdo principal -->
  <main id="main-content" role="main" class="container stack mt-4 mb-6">
    <section class="stack mb-4">
      <h1 class="text-lg">📬 Central de E-mails</h1>
      <p class="text-sm text-muted">Acompanhe a fila de envios, filtre por status e reprocessse falhas.</p>
    </section>

    <!-- Filtros -->
    <section class="card p-3 stack gap-2">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <div class="stack gap-1">
          <label for="f-destination" class="text-xs">Destinatário</label>
          <input id="f-destination" class="input" placeholder="ex: cliente@dominio.com" />
        </div>
        <div class="stack gap-1">
          <label for="f-purpose" class="text-xs">Propósito</label>
          <input id="f-purpose" class="input" placeholder="ex: OTP_START / REGISTER_CONFIRM" />
        </div>
        <div class="stack gap-1">
          <label for="f-status" class="text-xs">Status</label>
          <select id="f-status" class="input">
            <option value="">(Todos)</option>
            <option value="PENDING">PENDING</option>
            <option value="SENT">SENT</option>
            <option value="FAILED">FAILED</option>
          </select>
        </div>
        <div class="stack gap-1">
          <label for="f-refresh" class="text-xs">Auto-refresh</label>
          <select id="f-refresh" class="input">
            <option value="0">Off</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
            <option value="30">30s</option>
          </select>
        </div>
      </div>

      <div class="row items-center justify-between mt-2">
        <div class="row gap-2">
          <button id="btnSearch" class="btn btn--primary">Buscar</button>
          <button id="btnClear" class="btn">Limpar</button>
        </div>

        <div class="row gap-2">
          <button id="prevPage" class="btn" title="Página anterior">&laquo;</button>
          <span class="text-sm text-muted">Página <strong id="pageNum">1</strong></span>
          <button id="nextPage" class="btn" title="Próxima página">&raquo;</button>
        </div>
      </div>
    </section>

    <!-- Grid -->
    <section class="card p-0 mt-3">
      <div class="table-responsive">
        <table class="table">
          <thead>
          <tr>
            <th>ID</th>
            <th>Propósito</th>
            <th>Destino</th>
            <th>Provider</th>
            <th>Status</th>
            <th>Tentativas</th>
            <th>MessageId</th>
            <th>Atualizado</th>
            <th>Ações</th>
          </tr>
          </thead>
          <tbody id="grid-body">
          <tr><td colspan="9" class="text-center text-muted">Sem resultados…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Detalhe do payload -->
    <section id="rawBox" class="card p-3 mt-3" hidden>
      <h2 class="text-md mb-2">Payload bruto</h2>
      <pre id="raw" class="code-block"></pre>
    </section>
  </main>

  <!-- Rodapé (fragmento compartilhado) -->
  <footer th:replace="~{fragments/footer :: footer}" role="contentinfo"></footer>

  <!-- JS -->
  <script defer th:src="@{/js/admin-email.js}"></script>
  <script defer th:src="@{/js/layout.js}"></script>
</body>
</html>
