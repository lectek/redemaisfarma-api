<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${form.id} != null ? 'Editar configuração' : 'Nova configuração'">Config</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="layout">
  <th:block th:replace="~{fragments/header :: header}"></th:block>
  <div class="layout__content">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <main class="page">
      <header class="page__header">
        <h1 class="page__title" th:text="${form.id} != null ? 'Editar configuração' : 'Nova configuração'">Config</h1>
        <div class="page__actions">
          <a th:href="@{/admin/settings}" class="btn">Voltar</a>
        </div>
      </header>

      <section class="card">
        <div class="card__body">
          <form class="form form--vertical" th:action="${form.id} != null ? @{|/admin/settings/${form.id}|} : @{/admin/settings}"
                th:object="${form}" method="post" autocomplete="off">
            <div class="form-group">
              <label for="chave">Chave</label>
              <input id="chave" class="input" th:field="*{chave}" placeholder="ex.: checkout.min_valor" required />
              <p class="error-message" th:if="${#fields.hasErrors('chave')}" th:errors="*{chave}"></p>
            </div>

            <div class="form-group">
              <label for="valor">Valor</label>
              <input id="valor" class="input" th:field="*{valor}" placeholder="ex.: 99.90" required />
              <p class="error-message" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></p>
            </div>

            <div class="form-group">
              <label for="descricao">Descrição</label>
              <textarea id="descricao" class="input" th:field="*{descricao}" rows="3"
                        placeholder="Como essa configuração é usada?"></textarea>
              <p class="error-message" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></p>
            </div>

            <div class="form__actions">
              <button class="btn btn--primary" type="submit">Salvar</button>
              <a th:href="@{/admin/settings}" class="btn">Cancelar</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
  <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
