<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minha conta - RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">
  <header th:replace="~{fragments/header :: header}"></header>

  <div class="layout layout--with-sidebar">
    <aside th:replace="~{fragments/sidebar :: sidebar('conta')}"></aside>

    <main id="main-content" class="container stack mt-4 mb-8" role="main">
      <h1 class="page-title">Minha conta</h1>
      <p class="text-muted">Bem-vindo a sua area do cliente. Use o menu ao lado para navegar.</p>

      <section class="card">
        <h2 class="title">Perfil</h2>
        <div class="between">
          <div class="stack">
            <img th:if="${avatarUrl != null and !#strings.isEmpty(avatarUrl)}"
                 th:src="${avatarUrl}"
                 alt="Foto de perfil"
                 style="width:96px;height:96px;border-radius:50%;object-fit:cover;"/>
            <div th:if="${avatarUrl == null or #strings.isEmpty(avatarUrl)}"
                 style="width:96px;height:96px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;">
              <strong th:text="${avatarNome != null ? avatarNome.substring(0,1) : 'U'}">U</strong>
            </div>
          </div>
          <a class="btn btn--primary" th:href="@{/cliente/dados}">Atualizar foto</a>
        </div>
      </section>

      <section class="card">
        <h2 class="title">Acoes rapidas</h2>
        <div class="between">
          <a class="btn" th:href="@{/cliente/pedidos}">Meus pedidos</a>
          <a class="btn" th:href="@{/cliente/dados}">Meus dados</a>
          <a class="btn" th:href="@{/cliente/senha}">Alterar senha</a>
          <a class="btn" th:href="@{/carrinho}">Meu carrinho</a>
        </div>
      </section>
    </main>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
