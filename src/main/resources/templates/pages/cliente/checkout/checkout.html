<!-- src/main/resources/templates/pages/checkout.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finalizar Pedido - RedeMaisFarma</title>

  <!-- Estilos -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">

  <!-- Header -->
  <header th:replace="~{fragments/header :: header}"></header>

  <div class="layout layout--with-sidebar">
    <aside th:replace="~{fragments/sidebar :: sidebar('checkout')}"></aside>

    <div class="container mt-4 mb-4">
      <!-- Titulo -->
      <h1 class="text-center text-lg mt-4">Finalizar Pedido</h1>
      <section th:replace="~{fragments/flash :: flash}"></section>

      <!-- Conteudo principal -->
      <main id="main-content" class="grid grid-cols-1 md:grid-cols-2 gap-32 mt-4 mb-4">

        <!-- Formulario de checkout -->
        <form class="card stack gap-16" th:action="@{/pedido/finalizar}" method="post" novalidate>
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <fieldset class="stack gap-8">
            <legend class="text-base font-semibold">Informacoes do Paciente</legend>

            <div class="stack gap-4">
              <label for="nome">Nome Completo *</label>
              <input type="text" id="nome" name="nome" required placeholder="Seu nome completo" class="form-input" />
            </div>

            <div class="stack gap-4">
              <label for="cpf">CPF *</label>
              <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" class="form-input" />
            </div>

            <div class="stack gap-4">
              <label for="email">E-mail para contato *</label>
              <input type="email" id="email" name="email" required placeholder="exemplo@dominio.com" class="form-input" />
            </div>

            <div class="stack gap-4">
              <label for="endereco">Endereco de Entrega *</label>
              <input type="text" id="endereco" name="endereco" required placeholder="Rua, numero, bairro, cidade" class="form-input" />
            </div>
          </fieldset>

          <fieldset class="stack gap-8">
            <legend class="text-base font-semibold">Forma de Pagamento</legend>

            <div class="stack gap-4">
              <label for="pagamento">Selecione o metodo *</label>
              <select id="pagamento" name="pagamento" required class="form-input" th:disabled="${paymentMethodsEmpty}">
                <option value="">Selecione</option>
                <option th:each="m : ${paymentMethods}" th:value="${m.value}" th:text="${m.label}">PIX</option>
              </select>
              <p class="alert alert-info" th:if="${paymentMethodsEmpty}">
                Nenhum metodo de pagamento esta ativo. Finalize isso no painel admin.
              </p>
              <p class="alert alert-warning" th:if="${cartHasInvalidItems}">
                Ajuste os itens do carrinho antes de confirmar o pedido.
              </p>
            </div>
          </fieldset>

          <div class="text-right">
            <button type="submit" class="btn btn--primary" th:disabled="${paymentMethodsEmpty or cartEmpty or cartHasInvalidItems}">Confirmar Pedido</button>
          </div>

          <div class="trust-badges flex items-center gap-8 mt-4">
            <img src="/img/ssl.svg" alt="SSL Seguro" width="24" height="24" />
            <span class="text-sm">Ambiente 100% seguro</span>
          </div>
        </form>

        <!-- Resumo do pedido -->
        <aside class="card stack gap-16">
          <h2 class="text-base font-semibold">Resumo do Pedido</h2>
          <div class="stack gap-8" th:if="${!cartEmpty}">
            <div class="between text-sm" th:each="i : ${cartItems}">
              <span th:text="${i.nome}">Produto</span>
              <span th:text="${#numbers.formatCurrency(i.subtotal, 'pt_BR')}">R$ 0,00</span>
            </div>
            <div class="between font-semibold">
              <span>Total</span>
              <span th:text="${#numbers.formatCurrency(cartSummary.total, 'pt_BR')}">R$ 0,00</span>
            </div>
          </div>
          <p class="text-sm text-gray-600" th:if="${cartEmpty}">Seu carrinho esta vazio.</p>
        </aside>
      </main>
    </div>
  </div>

  <!-- Footer -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
