<!-- src/main/resources/templates/pages/checkout.html -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finalizar Pedido • RedeMaisFarma</title>

  <!-- Estilos -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body class="body-flex">

  <!-- Header -->
  <header th:replace="~{fragments/header :: header}"></header>

  <!-- Título -->
  <h1 class="text-center text-lg mt-4">💊 Finalizar Pedido</h1>

  <!-- Conteúdo principal -->
  <main id="main-content" class="container grid grid-cols-1 md:grid-cols-2 gap-32 mt-4 mb-4">

    <!-- Formulário de checkout -->
    <form class="card stack gap-16" th:action="@{/pedido/finalizar}" method="post" novalidate>

      <fieldset class="stack gap-8">
        <legend class="text-base font-semibold">Informações do Paciente</legend>

        <div class="stack gap-4">
          <label for="nome">Nome Completo *</label>
          <input type="text" id="nome" name="nome" required placeholder="Seu nome completo" class="form-input" />
        </div>

        <div class="stack gap-4">
          <label for="cpf">CPF *</label>
          <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" class="form-input" />
        </div>

        <div class="stack gap-4">
          <label for="email">E-mail para contato *</label>
          <input type="email" id="email" name="email" required placeholder="exemplo@dominio.com" class="form-input" />
        </div>

        <div class="stack gap-4">
          <label for="endereco">Endereço de Entrega *</label>
          <input type="text" id="endereco" name="endereco" required placeholder="Rua, número, bairro, cidade" class="form-input" />
        </div>
      </fieldset>

      <fieldset class="stack gap-8">
        <legend class="text-base font-semibold">Forma de Pagamento</legend>

        <div class="stack gap-4">
          <label for="pagamento">Selecione o método *</label>
          <select id="pagamento" name="pagamento" required class="form-input">
            <option value="">Selecione…</option>
            <option value="pix">PIX (recomendado)</option>
            <option value="boleto">Boleto Bancário</option>
            <option value="credito">Cartão de Crédito</option>
            <option value="debito">Cartão de Débito</option>
          </select>
        </div>
      </fieldset>

      <div class="text-right">
        <button type="submit" class="btn btn--primary">Confirmar Pedido</button>
      </div>

      <div class="trust-badges flex items-center gap-8 mt-4">
        <img src="/img/ssl.svg" alt="SSL Seguro" width="24" height="24" />
        <span class="text-sm">Ambiente 100% seguro 🔒</span>
      </div>
    </form>

    <!-- Resumo do pedido -->
    <aside class="card stack gap-16">
      <h2 class="text-base font-semibold">Resumo do Pedido</h2>
      <p class="text-sm text-gray-600">Os medicamentos selecionados aparecerão aqui após o login.</p>
    </aside>
  </main>

  <!-- Footer -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
