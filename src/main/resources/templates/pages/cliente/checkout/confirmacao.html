<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Compra | RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
  <div class="confirm-container fade-in">
    <h1>Pedido Confirmado!</h1>
    <p>Obrigado por sua compra. Agora precisamos saber como deseja receber sua nota fiscal.</p>

    <form class="nota-fiscal-form" id="notaFiscalForm">
      <h2>Como deseja receber sua Nota Fiscal?</h2>
      
      <label>
        <input type="radio" name="notaFiscal" value="fisica" required />
        Receber versão física junto com o pedido
      </label>

      <label>
        <input type="radio" name="notaFiscal" value="email" />
        Receber versão digital por e-mail
      </label>

      <div id="emailInputGroup" style="display: none;">
        <label for="email">Digite seu e-mail:</label>
        <input type="email" name="email" id="email" placeholder="exemplo@rede.com" />
      </div>

      <button type="submit" class="btn-confirmar">Confirmar Preferência</button>
    </form>

    <div class="mensagem-confirmacao" id="mensagemConfirmacao" style="display: none;">
      Sua preferência foi registrada! Obrigado por escolher a RedeMaisFarma 💙
    </div>
  </div>

  <script>
    const form = document.getElementById('notaFiscalForm');
    const mensagem = document.getElementById('mensagemConfirmacao');
    const radios = document.querySelectorAll('input[name="notaFiscal"]');
    const emailInputGroup = document.getElementById('emailInputGroup');

    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        emailInputGroup.style.display = (radio.value === 'email') ? 'block' : 'none';
      });
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const selected = document.querySelector('input[name="notaFiscal"]:checked').value;
      const email = document.getElementById('email').value;

      const payload = {
        nome: "Nome Temporário", // Você pode substituir futuramente por nome real do cliente
        preferencia: selected,
        email: selected === 'email' ? email : ''
      };

      try {
        const response = await fetch('/nota-fiscal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(payload)
        });

        if (response.ok) {
          mensagem.style.display = 'block';
          form.reset();
          emailInputGroup.style.display = 'none';
        } else {
          alert('Erro ao registrar sua preferência. Tente novamente.');
        }
      } catch (error) {
        alert('Erro de conexão com o servidor.');
      }
    });
  </script>
</body>
</html>
