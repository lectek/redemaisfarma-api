<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Alterar senha • RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <script defer th:src="@{/js/pages/cliente/mudar-senha.js}"></script>
  <script defer th:src="@{/js/password-meter.js}"></script>
</head>
<body class="body-flex">
  <!-- Header e sidebar do layout do cliente -->
  <header th:replace="~{fragments/header :: header}"></header>

  <div class="layout layout--with-sidebar">
    <aside th:replace="~{fragments/sidebar :: sidebar('conta')}"></aside>

    <main class="container">
      <section class="card">
        <h1 class="title">Alterar senha</h1>

      <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
      <div th:if="${infoMessage}"  class="alert alert-info"  th:text="${infoMessage}"></div>

      <!-- ✅ envia para o controller /auth/mudar-senha -->
      <form th:action="@{/auth/mudar-senha}" th:object="${form}" method="post" class="form-grid" autocomplete="off">
        <!-- CSRF só se existir (evita erros quando CSRF estiver desligado em algum perfil) -->
        <div th:if="${_csrf != null}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </div>

        <div class="form-group">
          <label for="senhaAtual">Senha atual</label>
          <input type="password" id="senhaAtual" th:field="*{senhaAtual}" class="input" required />
          <p class="error-message" th:if="${#fields.hasErrors('senhaAtual')}" th:errors="*{senhaAtual}"></p>
        </div>

        <div class="form-group">
          <label for="novaSenha">Nova senha</label>
          <input type="password" id="novaSenha" th:field="*{novaSenha}" class="input" required
                 data-meter="true" data-meter-target="#meterMsg"/>
          <small id="meterMsg" class="hint"></small>
          <p class="error-message" th:if="${#fields.hasErrors('novaSenha')}" th:errors="*{novaSenha}"></p>
        </div>

        <div class="form-group">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarNovaSenha" th:field="*{confirmarNovaSenha}" class="input" required />
          <p class="error-message" th:if="${#fields.hasErrors('confirmarNovaSenha')}" th:errors="*{confirmarNovaSenha}"></p>
        </div>

        <button type="submit" class="btn btn--primary">Salvar</button>
        <a th:href="@{/cliente}" class="btn">Cancelar</a>
        </form>
      </section>
    </main>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
