<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Produto - RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/pages/produto-detalhe.css}" />
</head>
<body class="body-flex">
  <header th:replace="~{fragments/header :: header}"></header>

  <div class="layout layout--with-sidebar">
    <aside th:replace="~{fragments/sidebar :: sidebar('produtos')}"></aside>

    <main id="main-content" class="container mt-4 mb-6 produto-detalhe">
      <nav class="breadcrumb" aria-label="Caminho de navegacao">
        <a th:href="@{/}">Inicio</a>
        <span aria-hidden="true">/</span>
        <a th:href="@{/produtos}">Produtos</a>
        <span aria-hidden="true">/</span>
        <span th:text="${produto.nome}">Produto</span>
      </nav>

      <section class="card produto-detalhe__card" th:with="hasPromo=${produto.precoPromocional != null and produto.precoPromocional > 0}">
        <div class="produto-detalhe__media">
          <img th:src="${produto.imagem} ?: @{/img/produtos/placeholder-generico.png}"
               th:alt="${produto.nome}" loading="lazy"
               onerror="this.src='/img/produtos/placeholder-generico.png'">
        </div>

        <div class="produto-detalhe__info">
          <div class="produto-detalhe__meta">
            <span class="badge badge--neutral" th:text="${produto.categoria}">Categoria</span>
            <span class="badge badge--warning" th:if="${tarjaMedicacao != null}"
                  th:text="${tarjaMedicacao.rotulo}">Tarja</span>
            <span class="badge badge--danger" th:if="${outOfStock}">Sem estoque</span>
            <span class="badge badge--warning" th:if="${produto.disponivel != null and !produto.disponivel}">Indisponivel</span>
          </div>

          <h1 class="produto-detalhe__title" th:text="${produto.nome}">Produto</h1>
          <p class="produto-detalhe__desc" th:text="${produto.descricao} ?: 'Descricao nao informada.'">Descricao</p>

          <div class="produto-detalhe__price">
            <div th:if="${hasPromo}">
              <span class="price-old" th:text="${#numbers.formatCurrency(produto.precoVenda, 'pt_BR')}">R$ 0,00</span>
              <span class="price-now" th:text="${#numbers.formatCurrency(produto.precoPromocional, 'pt_BR')}">R$ 0,00</span>
            </div>
            <div th:if="${!hasPromo}">
              <span class="price-now" th:text="${#numbers.formatCurrency(produto.precoVenda, 'pt_BR')}">R$ 0,00</span>
            </div>
          </div>

          <div class="produto-detalhe__stock">
            <span class="stock-label">Estoque:</span>
            <span th:if="${produto.estoque != null}" th:text="${produto.estoque}">0</span>
            <span th:if="${produto.estoque == null}">Sob consulta</span>
          </div>

          <div class="alert alert-warning" th:if="${exigeReceita}">
            <strong>Receita medica obrigatoria.</strong>
            <p class="m-0">Nao somos autorizados a entregar antes do recebimento da receita.</p>
          </div>

          <p class="text-muted" th:if="${tarjaDescricao != null}" th:text="${tarjaDescricao}"></p>

          <form th:action="@{/carrinho/adicionar}" method="post" class="produto-detalhe__cta">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="produtoId" th:value="${produto.id}"/>
            <input type="hidden" name="quantidade" value="1"/>
            <button type="submit" class="btn btn--primary"
                    th:disabled="${!produto.disponivel or outOfStock}"
                    th:attr="aria-disabled=${!produto.disponivel or outOfStock}">
              Adicionar ao carrinho
            </button>
          </form>

          <div class="produto-detalhe__details">
            <div>
              <span class="detail-label">Codigo de barras</span>
              <span th:text="${produto.codigoBarras} ?: '-'">000</span>
            </div>
            <div>
              <span class="detail-label">Unidade</span>
              <span th:text="${produto.unidade} ?: '-'">Un</span>
            </div>
            <div>
              <span class="detail-label">Fabricante</span>
              <span th:text="${produto.fabricante} ?: '-'">Fornecedor</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
