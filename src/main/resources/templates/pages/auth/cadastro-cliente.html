<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cadastro de Cliente • RedeMaisFarma</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <meta name="color-scheme" content="light dark"/>

  <!-- CSRF para o JS (se o Spring Security expuser) -->
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

  <!-- Favicon opcional -->
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}"/>
</head>
<body class="body-flex">

  <header th:replace="~{fragments/header :: header}"></header>

  <main class="form-container" id="main-content" tabindex="-1">
    <section class="form-card" aria-labelledby="titulo-cadastro">
      <h1 id="titulo-cadastro" class="form-title">Cadastro de Cliente</h1>

      <!-- Mensagens globais / flash -->
      <div th:if="${#fields.hasGlobalErrors()}" class="alert error"
           th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>
      <div th:if="${infoMessage}"  class="alert info"  th:text="${infoMessage}"></div>

      <!-- Área de alerta controlada pelo JS -->
      <div id="alert" class="alert" role="status" aria-live="polite"></div>

      <!-- ✅ Ajustado: action para /auth/cliente/cadastro e objeto de binding cadastro -->
      <form id="cadastroForm"
            th:action="@{/auth/cliente/cadastro}"
            th:object="${cadastro}"
            method="post"
            class="form-grid"
            autocomplete="on"
            novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Honeypot anti-bot -->
        <div style="position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden;">
          <label for="hp">Não preencha este campo</label>
          <input id="hp" name="website" type="text" tabindex="-1" autocomplete="off"/>
        </div>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input id="nome" type="text" th:field="*{nome}" class="input"
                 required autocomplete="name" />
          <p class="error-message" data-for="nome"></p>
          <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" th:field="*{email}" class="input"
                 required autocomplete="email" inputmode="email" />
          <p class="error-message" data-for="email"></p>
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" th:field="*{cpf}" class="input"
                 placeholder="123.456.789-09" inputmode="numeric" autocomplete="on"
                 title="Formato: 123.456.789-09" required />
          <p class="error-message" data-for="cpf"></p>
          <p th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone <small class="help">(Opcional)</small></label>
          <input id="telefone" type="tel" th:field="*{telefone}" class="input"
                 placeholder="(83) 91234-5678" autocomplete="tel" inputmode="tel" />
          <p class="error-message" data-for="telefone"></p>
          <p th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="dataNascimento">Data de nascimento <small class="help">(Opcional)</small></label>
          <input id="dataNascimento" type="date" th:field="*{dataDeNascimento}" class="input" autocomplete="bday"/>
          <p class="error-message" data-for="dataNascimento"></p>
          <p th:if="${#fields.hasErrors('dataDeNascimento')}" th:errors="*{dataDeNascimento}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" type="password" th:field="*{senha}" class="input"
                 required minlength="8" maxlength="128" autocomplete="new-password"
                 pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]{8,128}$"
                 data-pattern-msg="A senha precisa ter: 8+ caracteres, letra maiúscula, minúscula, número e símbolo (@ $ ! % * ? &)." />
          <small class="help">Use pelo menos 8 caracteres (maiúscula, minúscula, número e símbolo).</small>
          <p class="error-message" data-for="senha"></p>
          <p th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="error-message"></p>
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input id="confirmarSenha" type="password" th:field="*{confirmarSenha}" class="input"
                 required autocomplete="new-password" />
          <p class="error-message" data-for="confirmarSenha"></p>
          <p th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}" class="error-message"></p>
        </div>

        <!-- Canal para o OTP -->
        <fieldset class="form-group">
          <legend>Verificar por</legend>
          <label><input type="radio" th:field="*{canalOtp}" value="email" checked> E-mail</label>
          <label><input type="radio" th:field="*{canalOtp}" value="sms"> SMS (telefone)</label>
        </fieldset>

        <!-- Campos ocultos do fluxo OTP -->
        <input type="hidden" id="otpDeliveryId" th:field="*{otpDeliveryId}" />
        <input type="hidden" id="otpToken" th:field="*{otpToken}" />

        <button id="criarContaBtn" type="submit" class="btn btn--primary">Criar conta</button>

        <p class="mt-8" style="text-align:center">
          Já tem conta? <a th:href="@{/auth/login}">Entrar</a>
        </p>
      </form>
    </section>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <!-- Modal de código (OTP) -->
  <dialog id="otpDialog" aria-labelledby="otpTitle" aria-describedby="otpDesc" aria-modal="true">
    <form method="dialog" class="otp-card" id="otpForm">
      <h2 id="otpTitle">Verificar seu código</h2>
      <p id="otpDesc">Enviamos um código para <span id="otpDestino"></span>. Digite abaixo:</p>

      <div class="otp-grid" role="group" aria-label="Código de 6 dígitos">
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 1" />
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 2" />
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 3" />
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 4" />
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 5" />
        <input inputmode="numeric" pattern="\d*" maxlength="1" class="otp" aria-label="Dígito 6" />
      </div>

      <p class="error-message" id="otpError" aria-live="polite"></p>

      <div class="otp-actions">
        <button id="otpConfirmBtn" class="btn btn--primary" value="confirm" type="submit">Confirmar</button>
        <button id="otpResendBtn" class="btn btn--ghost" type="button">Reenviar código</button>
        <button class="btn btn--ghost" value="cancel">Cancelar</button>
      </div>

      <div class="otp-secondary">
        <small id="otpTimer" class="help" aria-live="polite"></small>
        <a href="#" id="otpNoCodeLink" class="link-quiet">Não recebeu o código?</a>
      </div>
    </form>
  </dialog>

  <!-- Scripts -->
  <script defer th:src="@{/js/layout.js?v=2}"></script>
  <script type="module" th:src="@{/js/pages/cliente/cadastro-otp.js?v=7}"></script>

  <noscript>
    <div class="alert error" style="margin:1rem">
      JavaScript está desativado. Ative para concluir o cadastro com verificação de código.
    </div>
  </noscript>
</body>
</html>
