<!-- src/main/resources/templates/pages/auth/escolhe-perfil.html -->
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>Escolher perfil</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f7f7f7; }
    .wrap { display:flex; align-items:center; justify-content:center; min-height: 70vh; }
    .card { width: 100%; max-width: 520px; padding: 1.5rem; border: 1px solid #e5e5e5; border-radius: 12px; background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,.06); }
    .row { display: flex; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }
    .btn { padding: .7rem 1rem; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; text-decoration: none; display:inline-block; }
    .btn.primary { background: #0d6efd; color: white; border-color: #0d6efd; }
    .btn.ghost { background: transparent; }
    .muted { color: #666; font-size: .95rem; }
    .spacer { height: .5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Escolher perfil</h1>
      <p class="muted">Selecione como deseja entrar agora.</p>

      <!-- propaga ?next=/rota se existir -->
      <input type="hidden" id="next" th:value="${param.next}" />

      <label style="display:flex;align-items:center;gap:.5rem;margin-top:.75rem;">
        <input type="checkbox" id="lembrar" /> Lembrar minha escolha neste dispositivo
      </label>

      <div class="row" sec:authorize="hasAnyAuthority('ROLE_DEVELOPER','ROLE_ADMIN')">
        <a id="btnAdmin" class="btn primary" href="#" rel="nofollow">Entrar como Admin</a>
      </div>

      <div class="row" sec:authorize="hasAuthority('ROLE_CLIENTE')">
        <a id="btnCliente" class="btn" href="#" rel="nofollow">Entrar como Cliente</a>
      </div>

      <div class="spacer"></div>

      <div class="row">
        <a class="btn ghost" th:href="@{/limpar-escolha}">Limpar escolha salva</a>
        <a class="btn ghost" th:href="@{/logout}">Sair</a>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const ctx = /*[[${#httpServletRequest.contextPath}]]*/ '';
    const next = document.getElementById('next').value || '';
    const lembrar = () => document.getElementById('lembrar').checked ? 'true' : 'false';
    const base = (ctx && ctx !== '/' ? ctx : '');

    function urlEntrar(as){
      const qs = new URLSearchParams();
      qs.set('as', as);
      if (lembrar() === 'true') qs.set('lembrar', 'true');
      if (next) qs.set('next', next);
      return `${base}/entrar-com?${qs.toString()}`;
    }

    const a = document.getElementById('btnAdmin');   if (a) a.href = urlEntrar('admin');
    const c = document.getElementById('btnCliente'); if (c) c.href = urlEntrar('cliente');
    /*]]>*/
  </script>
</body>
</html>
