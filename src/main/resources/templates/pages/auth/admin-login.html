<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin - Entrar</title>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
  <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="body-flex login-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="login-shell" id="main-content" tabindex="-1">
  <section class="login-card" aria-labelledby="titulo-admin-login">
    <header class="login-header">
      <p class="login-kicker">Acesso ao sistema</p>
      <h1 id="titulo-admin-login" class="login-title">Entrar</h1>
      <p class="login-subtitle">Ambiente administrativo com acesso restrito.</p>
    </header>

    <div th:if="${param.error}" class="alert error">Credenciais inválidas.</div>
    <div th:if="${param.logout}" class="alert info">Sessão encerrada.</div>

    <form th:action="@{/auth/login}" method="post" class="login-form" novalidate>
      <input type="hidden" name="perfil" value="admin"/>
      <input type="hidden" name="redirect" value="/admin/dashboard"/>
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="segmented" role="group" aria-label="Tipo de acesso">
        <a class="segmented__option segmented__link" th:href="@{/auth/login}"><span>Cliente</span></a>
        <div class="segmented__option is-active" aria-current="true"><span>Admin</span></div>
      </div>

      <div class="field">
        <label for="admin-usuario">Usuário / E-mail</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2-8 4.5V20h16v-1.5C20 16 16.4 14 12 14Z"/></svg>
          </span>
          <input id="admin-usuario" class="input" type="text" name="username" autocomplete="username" required autofocus/>
        </div>
      </div>

      <div class="field">
        <label for="admin-senha">Senha</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Zm2 0h8V8a4 4 0 1 0-8 0v2Z"/></svg>
          </span>
          <input id="admin-senha" class="input" type="password" name="password" autocomplete="current-password" required/>
          <button type="button" class="toggle-pass" id="toggleSenhaAdmin"
                  aria-pressed="false" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" class="toggle-icon"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7Zm0 3.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
          </button>
        </div>
        <small class="help">Use sua senha administrativa.</small>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember-me"/> <span>Lembrar-me</span>
      </label>

      <div class="login-actions">
        <button class="btn btn--primary" type="submit">Entrar</button>
        <a class="btn btn--ghost" th:href="@{/auth/login}">Voltar</a>
      </div>
    </form>
  </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
  document.getElementById('toggleSenhaAdmin')?.addEventListener('click', (ev) => {
    const f = document.getElementById('admin-senha');
    const btn = ev.currentTarget;
    const isHidden = f.type === 'password';
    f.type = isHidden ? 'text' : 'password';
    btn.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
    btn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
  });
</script>
</body>
</html>
