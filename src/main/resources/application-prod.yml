spring:
  config:
    activate:
      on-profile: prod

  jackson:
    time-zone: ${SPRING_JACKSON_TIME_ZONE:America/Fortaleza}
  messages:
    encoding: ${SPRING_MESSAGES_ENCODING:UTF-8}

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: ${SPRING_MAIL_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:20000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:20000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:20000}
          quitwait: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_QUITWAIT:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
            checkserveridentity: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY:true}
            protocols: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_PROTOCOLS:TLSv1.3 TLSv1.2}

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: mysqlHikari
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:4}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:8MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:8MB}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    table: flyway_schema_history
    locations: classpath:db/migration,classpath:db/migration-mysql,classpath:db/migration/PROD
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

  kafka:
    enabled: false
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    listener:
      missing-topics-fatal: ${SPRING_KAFKA_MISSING_TOPICS_FATAL:true}

redis:
  enabled: false

  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:2}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /
    encoding:
      enabled: ${SERVER_SERVLET_ENCODING_ENABLED:true}
      force: ${SERVER_SERVLET_ENCODING_FORCE:true}
      charset: ${SERVER_SERVLET_ENCODING_CHARSET:UTF-8}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: ${SERVER_COMPRESSION_MIME_TYPES:application/json,text/html,text/css,text/javascript,application/javascript,application/xml,text/plain}
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:1024}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}
    include-exception: ${SERVER_ERROR_INCLUDE_EXCEPTION:false}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
  server:
    # Health divulgates na mesma porta do app com fallback PORT/SERVER_PORT
    port: ${MANAGEMENT_SERVER_PORT:${PORT:${SERVER_PORT:8080}}}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
  pattern:
    level: "%5p [%X{X-Correlation-Id}]"

security:
  jwt:
    enabled: ${JWT_ENABLED:true}
    issuer: ${JWT_ISSUER:redemaisfarma-api}
    secret: ${JWT_SECRET}
    access-token:
      ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token:
      ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

jwt:
  enabled: ${JWT_ENABLED:true}
  issuer: ${JWT_ISSUER:redemaisfarma-api}
  secret: ${JWT_SECRET}
  accessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refreshTokenExpirationMinutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}

app:
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
    cors:
      allowed-origins: ${APP_WEB_CORS_ALLOWED_ORIGENS:}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:no-reply@local.redemaisfarma}
    bcc: ${APP_MAIL_BCC:}
    css-url: ${APP_MAIL_CSS_URL:}
    send-timeout-ms: ${APP_MAIL_SEND_TIMEOUT_MS:10000}
    noop: ${APP_MAIL_NOOP:false}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    provider: ${APP_SMS_PROVIDER:twilio}
    from: ${APP_SMS_FROM:}
    default-country-code: ${APP_SMS_DEFAULT_COUNTRY_CODE:55}
    twilio:
      account-sid: ${APP_SMS_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
      auth-token: ${APP_SMS_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
      messaging-service-sid: ${APP_SMS_TWILIO_MESSAGING_SERVICE_SID:${TWILIO_MESSAGING_SERVICE_SID:}}
  kafka:
    groups:
      pedidos: ${APP_KAFKA_GROUP_PEDIDOS:pedidos-consumer}

legacy:
  sync:
    enabled: false

admin:
  legacy:
    enabled: false
