<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coleira Vermelha • EMBALANDO</title>

  <!-- Estilos principais -->
  <link rel="stylesheet" th:href="@{/css/layout.css}" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="body-flex">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="left">
      <a href="/" class="logo-link" aria-label="Página inicial">
        <img th:src="@{/images/logo-embalando.png}" alt="Logo da Embalando" class="logo" />
      </a>
      <button class="menu-button">Painel</button>
      <button class="menu-button">Produtos</button>
      <button class="menu-button">Pedidos</button>
      <button class="menu-button">Clientes</button>
    </div>
    <button class="menu-button">Sair</button>
  </nav>

  <!-- Conteúdo principal -->
  <main id="main-content" class="container produto-detalhe grid gap-32 mt-4 mb-4">
    <!-- Imagem do produto -->
    <div>
      <img th:src="@{/img/produto1.jpg}" alt="Coleira Vermelha"
           class="produto-imagem rounded-md shadow-md" />
    </div>

    <!-- Informações do produto -->
    <section class="stack gap-8">
      <h1 class="text-xl font-bold">Coleira Vermelha</h1>
      <p class="text-sm text-gray-600">
        Coleira ajustável, confortável e estilosa para cães de médio porte.
        Material resistente com fecho seguro e toque macio.
      </p>
      <p class="text-lg font-semibold text-green-700">R$ 49,90</p>
      <button class="btn btn--primary w-fit">Adicionar ao carrinho</button>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="footer--sticky">
    <p>© 2025 Embalando • Loja Online</p>
  </footer>

</body>
</html>
